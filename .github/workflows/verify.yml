name: Verify PokéStudio changes

on:
  pull_request:
    branches: [main, feature/ai-project-editor-level2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax checks
        run: npm run check
      - name: Unit tests
        run: npm test
